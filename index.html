<style>

:root[data-theme="dark"]{--bg:#12141b;--card:#1c1f2a;--tx:#eceef4;--mu:#9aa1b2;--pr:#818cf8;--prt:#12141b;--ok:#4ade80;--okb:#12301d;--bad:#f87171;--badb:#3a1818;--bd:#2c3040;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}

.card{border-radius:14px}
.hub{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tl{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;border-radius:14px;min-height:112px}
.tl .ic{font-size:26px}.tl .mu{font-size:13px;line-height:1.35}

.tx{overflow-x:auto}.unit>summary{cursor:pointer;font-size:18px}h3{font-size:15px;margin:16px 0 6px;color:var(--pr)}

 if(mode=='match'&&M.t0&&!M.fin){clearInterval(M.tm);M.tm=setInterval(()=>{const e=$('#tm');if(e)e.textContent=Math.floor((Date.now()-M.t0)/1000)+'s';else clearInterval(M.tm)},500)}
}
/* ===== games ===== */
const stars=(s,n)=>s>=n*.9?'⭐⭐⭐':s>=n*.6?'⭐⭐':'⭐';
const fin=(t,sub,again)=>`<div class="card c"><div class="big2">${t}</div><p>${sub}</p><div class="row" style="justify-content:center"><button class="pr" onclick="${again}">Chơi lại</button><button onclick="go('list')">Xem từ vựng</button></div></div>`;
const empty=`<div class="card c mu">Phần đã chọn không có đủ từ phù hợp cho trò chơi này. Hãy chọn thêm Unit hoặc mục khác.</div>`;
const bar=(i,n)=>`<div class="bar"><i style="width:${i/n*100}%"></i></div>`;
function pickOpts(w,f,k){k=k||3;const ok=x=>x!==w&&x[f]!==w[f];
 let p=shuffle(ALL.filter(x=>ok(x)&&x.s==w.s&&x.u==w.u));
 if(p.length<k)p=p.concat(shuffle(ALL.filter(x=>ok(x)&&x.s==w.s&&!p.includes(x))));
 if(p.length<k)p=p.concat(shuffle(ALL.filter(x=>ok(x)&&!p.includes(x))));
 const seen=new Set([w[f]]),wr=[];for(const x of p){if(!seen.has(x[f])){seen.add(x[f]);wr.push(x[f])}if(wr.length==k)break}
 return shuffle([w[f],...wr])}
const optBtns=(o,ans,a,fn)=>`<div class="opts">${o.map((t,j)=>`<button class="opt ${a!==null?(t==ans?'ok':(j==a?'bad':'')):''}" ${a!==null?'disabled':''} onclick="${fn}(${j})">${esc(t)}</button>`).join('')}</div>`;
/* --- xếp chữ --- */
function scrStart(){const it=shuffle(W.filter(w=>/^[A-Za-z]{3,12}$/.test(w.en.replace(/^to /i,'')))).slice(0,10).map(w=>{const a=w.en.replace(/^to /i,'').toLowerCase();let t=shuffle(a.split(''));for(let k=0;k<5&&t.join('')==a;k++)t=shuffle(t);return{w,a,t}});G={k:'scr',it,i:0,s:0,pick:[],res:null,hint:false}}
function vScr(){if(!G.it.length)return empty;const n=G.it.length;
 if(G.i>=n)return fin(stars(G.s,n),`Bạn xếp đúng ${G.s}/${n} từ.`,"go('scr')");
 const it=G.it[G.i],built=G.pick.map(j=>it.t[j]).join('');
 return `${bar(G.i,n)}<div class="card c"><div class="mu">Từ ${G.i+1}/${n} — Xếp các chữ cái thành từ tiếng Anh</div><div class="big" style="margin:8px 0">${esc(it.w.vi)}</div><div class="ipa">${esc(it.w.ipa)} <button class="spk" onclick="say(${it.w.i})">🔊</button></div>
<div class="slots">${it.a.split('').map((c,k)=>`<span class="slot ${G.res?(G.res.ok?'ok':'bad'):''}">${esc(built[k]||(G.hint&&k==0?it.a[0]:''))}</span>`).join('')}</div>
<div>${it.t.map((c,j)=>`<button class="lt" ${G.pick.includes(j)||G.res?'disabled':''} onclick="scrPick(${j})">${esc(c)}</button>`).join('')}</div>
${G.res?`<div class="msg ${G.res.ok?'ok':'bad'}">${G.res.ok?'✓ Chính xác!':'✗ Đáp án: <b>'+esc(it.a)+'</b>'}</div><div style="margin-top:12px"><button class="pr" onclick="scrNext()">Tiếp →</button></div>`:`<div class="row" style="justify-content:center;margin-top:12px"><button onclick="G.pick.pop();render()" ${G.pick.length?'':'disabled'}>⌫ Xóa</button><button onclick="G.hint=true;render()">💡 Gợi ý</button></div>`}</div>`}
function scrPick(j){const it=G.it[G.i];if(G.res||G.pick.includes(j))return;G.pick.push(j);if(G.pick.length==it.a.length){const ok=G.pick.map(x=>it.t[x]).join('')==it.a;if(ok)G.s++;mark(it.w.i,ok);G.res={ok}}render()}
function scrNext(){G.i++;G.pick=[];G.res=null;G.hint=false;if(G.i>=G.it.length)rec('scr',G.s,G.it.length);render()}
/* --- xếp câu --- */
function ordStart(){const it=shuffle(W.filter(w=>{const n=(w.ex||'').split(/\s+/).filter(Boolean).length;return n>=4&&n<=14})).slice(0,8).map(w=>{const tk=w.ex.split(/\s+/).filter(Boolean);let sh=shuffle(tk.map((t,j)=>j));if(sh.every((x,j)=>x==j))sh=sh.reverse();return{w,tk,sh}});G={k:'ord',it,i:0,s:0,pick:[],res:null}}
function vOrd(){if(!G.it.length)return empty;const n=G.it.length;
 if(G.i>=n)return fin(stars(G.s,n),`Bạn xếp đúng ${G.s}/${n} câu.`,"go('ord')");
 const it=G.it[G.i];
 return `${bar(G.i,n)}<div class="card"><div class="mu">Câu ${G.i+1}/${n} — Sắp xếp thành câu hoàn chỉnh</div><p style="margin:8px 0"><b>${esc(it.w.en)}</b> = ${esc(it.w.vi)}</p>
<div class="ansb ${G.res?(G.res.ok?'ok':'bad'):''}">${G.pick.map((j,p)=>`<button class="chipw" ${G.res?'disabled':''} onclick="ordUn(${p})">${esc(it.tk[j])}</button>`).join('')||'<span class="mu">Bấm vào các từ bên dưới theo đúng thứ tự…</span>'}</div>
<div>${it.sh.map(j=>`<button class="chipw" ${G.pick.includes(j)||G.res?'disabled':''} onclick="ordPick(${j})">${esc(it.tk[j])}</button>`).join('')}</div>
${G.res?`<div class="msg ${G.res.ok?'ok':'bad'}">${G.res.ok?'✓ Đúng rồi!':'✗ Câu đúng: <b>'+esc(it.tk.join(' '))+'</b>'}</div><div class="row sp" style="margin-top:12px"><button onclick="say(${it.w.i})">🔊 Nghe từ</button><button class="pr" onclick="ordNext()">Tiếp →</button></div>`:`<div class="row sp" style="margin-top:12px"><button onclick="G.pick=[];render()" ${G.pick.length?'':'disabled'}>Xóa hết</button><button class="pr" onclick="ordCheck()" ${G.pick.length==it.tk.length?'':'disabled'}>Kiểm tra</button></div>`}</div>`}
function ordPick(j){if(G.res||G.pick.includes(j))return;G.pick.push(j);render()}
function ordUn(p){if(G.res)return;G.pick.splice(p,1);render()}
function ordCheck(){const it=G.it[G.i],ok=G.pick.map(j=>it.tk[j]).join(' ')==it.tk.join(' ');if(ok)G.s++;mark(it.w.i,ok);G.res={ok};render()}
function ordNext(){G.i++;G.pick=[];G.res=null;if(G.i>=G.it.length)rec('ord',G.s,G.it.length);render()}
/* --- nghe & chọn --- */
function lisStart(){const it=shuffle(W).slice(0,10).map(w=>({w,o:pickOpts(w,'vi')}));G={k:'listen',it,i:0,s:0,a:null}}
function vLis(){if(!G.it.length)return empty;const n=G.it.length;
 if(G.i>=n)return fin(stars(G.s,n),`Bạn nghe đúng ${G.s}/${n} từ.`,"go('listen')");
 const it=G.it[G.i],w=it.w,ok=!('speechSynthesis' in window);
 return `${bar(G.i,n)}<div class="card c"><div class="mu">Câu ${G.i+1}/${n} — Nghe và chọn nghĩa tiếng Việt đúng</div>${ok?'<p class="mu">Thiết bị này chưa hỗ trợ phát âm, bạn hãy thử trên trình duyệt khác.</p>':''}
<div style="margin:14px 0"><button class="pr" style="font-size:30px;padding:14px 28px;border-radius:50%" onclick="say(${w.i})">🔊</button></div>${optBtns(it.o,w.vi,G.a,'lisAns')}
${G.a!==null?`<div class="row sp" style="margin-top:12px"><span class="mu">${esc(w.en)} ${esc(w.ipa)} = ${esc(w.vi)}</span><button class="pr" onclick="lisNext()">Tiếp →</button></div>`:''}</div>`}
function lisAns(j){const it=G.it[G.i],ok=it.o[j]==it.w.vi;G.a=j;if(ok)G.s++;mark(it.w.i,ok);render()}
function lisNext(){G.i++;G.a=null;if(G.i>=G.it.length)rec('listen',G.s,G.it.length);else say(G.it[G.i].w.i);render()}
/* --- đua 60 giây --- */
function raceStart(){G={k:'race',pool:shuffle(W),i:0,s:0,n:0,combo:0,best:0,run:false,done:false,a:null,cur:null}}
function raceBegin(){G.run=true;G.end=Date.now()+60000;G.tm=setInterval(raceTick,250);render()}
function raceTick(){const left=Math.max(0,Math.ceil((G.end-Date.now())/1000));const e=$('#rt');if(e)e.textContent=left+'s';if(left<=0)raceEnd()}
function raceEnd(){if(G.done)return;clearInterval(G.tm);G.run=false;G.done=true;rec('race',G.s,G.n,60);render()}
function raceCur(){if(!G.cur){const w=G.pool[G.i%G.pool.length],d=Math.random()<.5?0:1,f=d?'en':'vi';G.cur={w,d,f,o:pickOpts(w,f)}}return G.cur}
function vRace(){
 if(G.done)return fin(G.s+' ✓',`Trả lời đúng ${G.s}/${G.n} câu trong 60 giây · chuỗi đúng dài nhất ${G.best}.`,"go('race')");
 if(!G.run)return `<div class="card c"><div class="big2">⚡</div><div class="big" style="margin:10px 0">Đua 60 giây</div><p class="mu">Trả lời đúng càng nhiều câu càng tốt. Sai không bị trừ điểm nhưng sẽ mất chuỗi đúng liên tiếp.</p><button class="pr" onclick="raceBegin()">Bắt đầu</button></div>`;
 const c=raceCur(),left=Math.max(0,Math.ceil((G.end-Date.now())/1000));
 return `<div class="card"><div class="row sp"><span>⏱ <b id="rt">${left}s</b></span><span>✓ ${G.s} · 🔥 chuỗi ${G.combo}</span></div><div class="mu" style="margin-top:8px">${c.d?'Chọn từ/cụm tiếng Anh':'Chọn nghĩa tiếng Việt'}</div><div class="big" style="margin:6px 0">${esc(c.d?c.w.vi:c.w.en)}</div>${optBtns(c.o,c.w[c.f],G.a,'raceAns')}</div>`}
function raceAns(j){if(G.a!==null||!G.run)return;const c=G.cur,ok=c.o[j]==c.w[c.f];G.a=j;G.n++;if(ok){G.s++;G.combo++;G.best=Math.max(G.best,G.combo)}else G.combo=0;mark(c.w.i,ok);render();setTimeout(()=>{G.i++;G.a=null;G.cur=null;if(G.run)render()},ok?250:700)}
/* --- lật thẻ nhớ --- */
function memStart(){let pool=W.filter(w=>!w.en.includes(';'));if(pool.length<2)pool=W;const ws=shuffle(pool).slice(0,6);G={k:'mem',c:shuffle(ws.flatMap((w,i)=>[{id:i,w:w.i,t:w.en,k:0},{id:i,w:w.i,t:w.vi,k:1}])),open:[],done:new Set(),moves:0,lock:false,t0:Date.now(),fin:null}}
function vMem(){if(G.c.length<4)return empty;
 return `<div class="card"><div class="row sp"><span>Lật hai thẻ để tìm cặp Anh – Việt</span><span class="mu">${G.moves} lượt${G.fin?' · '+G.fin+'s':''}</span></div></div><div class="mg">${G.c.map((c,i)=>{const up=G.open.includes(i)||G.done.has(i);return `<button class="mc ${G.done.has(i)?'done':up?'':'back'}" onclick="memClick(${i})">${up?esc(c.t):'?'}</button>`}).join('')}</div>
${G.fin!==null?`<div class="card c" style="margin-top:14px"><div class="big2">${stars(G.c.length/2,G.moves)}</div><p>Hoàn thành trong ${G.fin}s với ${G.moves} lượt.</p><div class="row" style="justify-content:center"><button class="pr" onclick="go('mem')">Chơi lại</button><button onclick="go('list')">Xem từ vựng</button></div></div>`:''}`}
function memClick(i){if(G.lock||G.fin!==null||G.done.has(i)||G.open.includes(i))return;G.open.push(i);if(G.open.length==2){G.moves++;const a=G.c[G.open[0]],b=G.c[G.open[1]];if(a.id==b.id){G.done.add(G.open[0]);G.done.add(G.open[1]);G.open=[];mark(a.w,true);if(G.done.size==G.c.length){G.fin=Math.floor((Date.now()-G.t0)/1000);rec('mem',G.c.length/2,G.moves,G.fin)}}else{G.lock=true;setTimeout(()=>{G.open=[];G.lock=false;render()},900)}}render()}
/* ===== danh sách từ ===== */
function vList(){
 if(!W.length)return '<div class="card c mu">Không có từ nào trong phần đã chọn.</div>';
 const U=[...new Set(W.map(w=>w.u))];
 return `<div class="row" style="margin-bottom:10px"><button onclick="document.querySelectorAll('.unit').forEach(d=>d.open=true)">Mở tất cả</button><button onclick="document.querySelectorAll('.unit').forEach(d=>d.open=false)">Thu gọn tất cả</button></div>`+U.map(u=>{
  const ws=W.filter(w=>w.u==u),S=[...new Set(ws.map(w=>w.s))];
  return `<details class="card unit" open><summary><b>${esc(u)}</b> <span class="mu">· ${ws.length} từ</span></summary>`+S.map(sec=>{
   const L=ws.filter(w=>w.s==sec);
   return `<h3>${esc(sec)} <span class="mu">(${L.length})</span></h3><div class="tx"><table><tr><th></th><th>English</th><th>IPA</th><th>Tiếng Việt</th><th>Ví dụ</th></tr>${L.map(w=>`<tr><td><button class="spk" onclick="say(${w.i})">🔊</button></td><td><b>${esc(w.en)}</b></td><td>${esc(w.ipa)}</td><td>${esc(w.vi)}</td><td class="mu">${esc(w.ex)}</td></tr>`).join('')}</table></div>`}).join('')+`</details>`}).join('')}
function vHome(){return `${vList()}
<details class="card"><summary>Nạp danh sách từ khác (tùy chọn)</summary>
<p class="mu">Mỗi dòng một từ: <b>English, IPA, Tiếng Việt, Ví dụ</b> (ngăn cách bằng dấu phẩy, tab, “|” hoặc “;”). Hỗ trợ file .csv, .txt, .tsv.</p>
<input type="file" accept=".csv,.txt,.tsv" onchange="onFile(event)"><p class="mu" style="margin-bottom:6px">Hoặc dán trực tiếp:</p><textarea id="paste"></textarea>
<div class="row" style="margin-top:8px"><button class="pr" onclick="importText($('#paste').value)">Nạp danh sách</button><button onclick="resetData()">Dùng lại danh sách Destination B1</button></div></details>`}
/* flashcards */
function fcStart(o){fc={order:o||shuffle(W.map(w=>w.i)),i:0,f:false,known:fc.known||new Set()}}
function vFc(){const n=fc.order.length;if(!n)return `<div class="card c">🎉 Bạn đã thuộc hết! <br><br><button class="pr" onclick="fc.known=new Set();syncKnown();fcStart();render()">Học lại từ đầu</button></div>`;
 if(fc.i>=n){const rest=W.filter(w=>!fc.known.has(w.i)).map(w=>w.i);return `<div class="card c"><div class="big">Xong vòng này!</div><p>Đã thuộc: ${W.filter(w=>fc.known.has(w.i)).length}/${W.length}</p><div class="row" style="justify-content:center">${rest.length?'<button class="pr" onclick="fcStart(shuffle(W.filter(w=>!fc.known.has(w.i)).map(w=>w.i)));render()">Ôn từ chưa thuộc</button>':''}<button onclick="fc.known=new Set();syncKnown();fcStart();render()">Học lại tất cả</button></div></div>`}
 const k=fc.order[fc.i],w=ALL[k];
 return `<div class="bar"><i style="width:${fc.i/n*100}%"></i></div><div class="row sp mu"><span>${fc.i+1}/${n}</span><span class="tag">${esc(w.u)} · ${esc(w.s)}</span></div>
<div class="card fc" onclick="fc.f=!fc.f;render()">${fc.f?`<div class="big">${esc(w.vi)}</div>${w.ex?`<div class="ex">${esc(w.ex)}</div>`:''}`:`<div class="big">${esc(w.en)}</div><div class="ipa">${esc(w.ipa)}</div>`}<div class="mu" style="margin-top:14px">Nhấn để lật thẻ (phím Space)</div></div>
<div class="row sp"><button onclick="say(${k})">🔊 Nghe</button><span class="row"><button onclick="fcNext(0)">✗ Chưa thuộc</button><button class="pr" onclick="fcNext(1)">✓ Đã thuộc</button></span></div>`}
function fcNext(ok){if(fc.i>=fc.order.length)return;const k=fc.order[fc.i];ok?fc.known.add(k):fc.known.delete(k);syncKnown();mark(k,!!ok);fc.i++;fc.f=false;if(fc.i>=fc.order.length)rec('fc',fc.order.filter(x=>fc.known.has(x)).length,fc.order.length);render()}
/* multiple choice */
function quizStart(){const n=Math.min(30,W.length);Q={items:shuffle(W).slice(0,n).map(w=>({w,d:Math.random()<.5?0:1})),i:0,s:0,a:null}}
function vQuiz(){const n=Q.items.length;if(Q.i>=n)return `<div class="card c"><div class="big">${Q.s}/${n}</div><p>${Q.s==n?'Tuyệt vời! 🎉':Q.s/n>=.8?'Rất tốt! 👏':'Cố gắng thêm nhé!'}</p><button class="pr" onclick="quizStart();render()">Làm lại</button></div>`;
 const it=Q.items[Q.i],w=it.w,f=it.d?'en':'vi';
 if(!it.o){const ok=x=>x!==w&&x[f]!==w[f];let p=shuffle(ALL.filter(x=>ok(x)&&x.s==w.s&&x.u==w.u));if(p.length<3)p=p.concat(shuffle(ALL.filter(x=>ok(x)&&x.s==w.s&&!p.includes(x))));if(p.length<3)p=p.concat(shuffle(ALL.filter(x=>ok(x)&&!p.includes(x))));
  const seen=new Set([w[f]]),wr=[];for(const x of p){if(!seen.has(x[f])){seen.add(x[f]);wr.push(x[f])}if(wr.length==3)break}it.o=shuffle([w[f],...wr])}
 return `<div class="bar"><i style="width:${Q.i/n*100}%"></i></div><div class="card"><div class="mu">Câu ${Q.i+1}/${n} — ${it.d?'Chọn từ/cụm tiếng Anh':'Chọn nghĩa tiếng Việt'}</div>
<div class="big" style="margin-top:8px">${esc(it.d?w.vi:w.en)}</div>${it.d?'':`<div class="ipa">${esc(w.ipa)} <button class="spk" onclick="say(${w.i})">🔊</button></div>`}
<div class="opts">${it.o.map((o,j)=>`<button class="opt ${Q.a!==null?(o==w[f]?'ok':(j==Q.a?'bad':'')):''}" ${Q.a!==null?'disabled':''} onclick="qAns(${j})">${esc(o)}</button>`).join('')}</div>
${Q.a!==null?`<div class="row sp" style="margin-top:12px"><span class="mu">${esc(w.en)} ${esc(w.ipa)} = ${esc(w.vi)}</span><button class="pr" onclick="qNext()">Tiếp →</button></div>`:''}</div>`}
function qAns(j){const it=Q.items[Q.i],f=it.d?'en':'vi';Q.a=j;const ok=it.o[j]==it.w[f];if(ok)Q.s++;mark(it.w.i,ok);render()}
function qNext(){Q.i++;Q.a=null;if(Q.i>=Q.items.length)rec('quiz',Q.s,Q.items.length);render()}
/* typing + cloze */
function typedStart(kind){let it=[];
 if(kind=='cloze'){shuffle(W).forEach(w=>{const b=w.ex&&blank(w);if(b)it.push({w,p:b.t,alts:[b.a],h:w.vi})})}
 else shuffle(W.filter(w=>!w.en.includes(';'))).forEach(w=>it.push({w,p:w.vi,alts:alts(w.en),h:w.ipa}));
 T={kind,items:it.slice(0,15),i:0,s:0,res:null}}
function vTyped(){if(!T.items.length)return `<div class="card c mu">Không có mục phù hợp cho bài tập này trong phần đã chọn. Hãy chọn thêm Unit hoặc mục khác.</div>`;
 const n=T.items.length;if(T.i>=n)return `<div class="card c"><div class="big">${T.s}/${n}</div><p>${T.s==n?'Chính xác hoàn toàn! 🎉':'Luyện thêm một lượt nữa nhé!'}</p><button class="pr" onclick="typedStart('${T.kind}');render()">Làm lại</button></div>`;
 const it=T.items[T.i],r=T.res;
 return `<div class="bar"><i style="width:${T.i/n*100}%"></i></div><div class="card"><div class="mu">Câu ${T.i+1}/${n} — ${T.kind=='cloze'?'Điền từ còn thiếu vào câu':'Gõ từ/cụm tiếng Anh có nghĩa sau'}</div>
<div class="big" style="margin:8px 0;font-size:${T.kind=='cloze'?22:28}px">${esc(it.p)}</div><div class="${T.kind=='cloze'?'mu':'ipa'}">${T.kind=='cloze'?'Nghĩa: ':'Phiên âm: '}${esc(it.h)}</div>
<div style="margin:12px 0"><input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Nhập đáp án…" ${r?'disabled value="'+esc(r.v)+'"':''} onkeydown="if(event.key=='Enter')tCheck()"></div>
${r?`<div class="msg ${r.ok?'ok':'bad'}">${r.ok?'✓ Đúng!':'✗ Đáp án: <b>'+esc(it.alts[0])+'</b>'}<div class="mu">${esc(it.w.en)} ${esc(it.w.ipa)} = ${esc(it.w.vi)}</div></div><div class="row sp" style="margin-top:12px"><button onclick="say(${it.w.i})">🔊 Nghe</button><button class="pr" onclick="tNext()">Tiếp →</button></div>`:`<button class="pr" onclick="tCheck()">Kiểm tra</button>`}</div>`}
function tCheck(){if(T.res)return;const e=$('#ans');if(!e||!e.value.trim())return;const it=T.items[T.i],ok=it.alts.some(a=>norm(a)==norm(e.value));if(ok)T.s++;mark(it.w.i,ok);T.res={ok,v:e.value};render()}
function tNext(){T.i++;T.res=null;if(T.i>=T.items.length)rec(T.kind,T.s,T.items.length);render()}
/* matching */
function matchStart(){clearInterval(M.tm);let pool=W.filter(w=>!w.en.includes(';'));if(pool.length<2)pool=W;const ws=shuffle(pool).slice(0,Math.min(6,pool.length));
 M={tiles:shuffle(ws.flatMap((w,i)=>[{id:i,w:w.i,t:w.en,k:0},{id:i,w:w.i,t:w.vi,k:1}])),sel:null,done:new Set(),bad:[],t0:Date.now(),fin:null,miss:0}}
function vMatch(){return `<div class="card"><div class="row sp"><span>Ghép từ tiếng Anh với nghĩa tiếng Việt</span><span class="mu">⏱ <span id="tm">${M.fin?M.fin+'s':'0s'}</span> · Sai: ${M.miss}</span></div></div>
<div class="grid">${M.tiles.map((t,i)=>`<button class="tile ${M.sel===i?'sel':''} ${M.done.has(i)?'done':''} ${M.bad.includes(i)?'bad':''}" onclick="mClick(${i})">${esc(t.t)}</button>`).join('')}</div>
${M.fin?`<div class="card c" style="margin-top:14px"><div class="big">Hoàn thành! 🎉</div><p>Thời gian ${M.fin}s, sai ${M.miss} lần.</p><button class="pr" onclick="matchStart();render()">Chơi lại</button></div>`:''}`}
function mClick(i){if(M.bad.length||M.done.has(i)||M.fin)return;if(M.sel===null)M.sel=i;else if(M.sel===i)M.sel=null;else{const a=M.tiles[M.sel],b=M.tiles[i];if(a.id==b.id&&a.k!=b.k){mark(a.w,true);M.done.add(M.sel);M.done.add(i);M.sel=null;if(M.done.size==M.tiles.length){M.fin=Math.floor((Date.now()-M.t0)/1000);clearInterval(M.tm);rec('match',M.tiles.length/2,M.tiles.length/2+M.miss,M.fin)}}else{mark(a.w,false);mark(b.w,false);M.miss++;M.bad=[M.sel,i];M.sel=null;setTimeout(()=>{M.bad=[];render()},600)}}render()}
document.addEventListener('keydown',e=>{if(mode=='fc'&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){if(e.key==' '){e.preventDefault();fc.f=!fc.f;render()}if(e.key=='ArrowRight')fcNext(1);if(e.key=='ArrowLeft')fcNext(0)}
 if((mode=='type'||mode=='cloze')&&T.res&&e.key=='Enter'){tNext()}});

/* ===== lịch sử học ===== */
const KIND={fc:'Flashcard',quiz:'Trắc nghiệm',type:'Gõ từ',cloze:'Điền câu',match:'Ghép cặp',scr:'Xếp chữ',ord:'Xếp câu',listen:'Nghe & chọn',race:'Đua 60s',mem:'Lật thẻ nhớ'};
let CUSTOM=false,DB=null,USR=null,UID=null,CAN=false,isAdmin=false,dirty=false,busy=false,tmr=null,LAST='',SSBASE={s:'init',t:'Đang kết nối để lưu lịch sử học…'};
let P={known:[],miss:{},sessions:[],n:0,sum:0,cnt:0,xp:0,st:0,day:'',last:null},CL={rows:null,names:{},err:''};
const sig=p=>JSON.stringify([p.known,p.miss,p.sessions,p.n,p.sum,p.cnt,p.xp,p.st,p.day,p.last]);
const day=o=>new Date(Date.now()-(o||0)*864e5).toLocaleDateString('en-CA');
function bump(){const d=day();if(P.day==d)return;P.st=(P.day==day(1))?(P.st||0)+1:1;P.day=d}
let LOCAL=false,USED=false;const lsk=()=>BOOK=='b1'?'b1vocab_progress_v1':'b1vocab_progress_v1_'+BOOK;const pdoc=()=>'data/users/'+UID+'/'+(BOOK=='b1'?'progress':'progress_'+BOOK);let SUMB={};
function showSS(){const e=$('#ss');if(e)e.textContent=CUSTOM?'Đang dùng danh sách riêng – lịch sử không được lưu.':SSBASE.t}
function setSS(s,t){SSBASE={s,t};showSS()}
function touch(){if(CUSTOM||!CAN)return;clearTimeout(tmr);tmr=setTimeout(flush,1500)}
function syncKnown(){if(CUSTOM)return;P.known=[...fc.known].sort((a,b)=>a-b);touch()}
function mark(id,ok){if(CUSTOM)return;const m=P.miss;if(ok){if(m[id]){m[id]--;if(m[id]<=0)delete m[id]}}else m[id]=(m[id]||0)+1;touch()}
function rec(m,s,n,d){if(CUSTOM)return;const e={t:Date.now(),m,s,n,f:(F.u+(F.s?' · '+F.s:''))||'Tất cả'};if(d!=null)e.d=d;P.sessions.push(e);if(P.sessions.length>100)P.sessions.shift();P.n++;if(m!='fc'&&n){P.sum+=s/n;P.cnt++}touch()}
async function flush(){
 if(busy||!CAN||CUSTOM||!BOOK)return;const j=sig(P);if(j==LAST)return;busy=true;
 if(LOCAL){try{localStorage.setItem(lsk(),JSON.stringify(P));LAST=j;setSS('ok','✓ Đã lưu trên thiết bị này'+(P.n?' · '+P.n+' bài đã làm':''))}catch(e){setSS('err','Không lưu được (trình duyệt đang chặn lưu trữ).')}busy=false;return}
 try{
  const top=Object.entries(P.miss).sort((a,b)=>b[1]-a[1]).slice(0,10).map(x=>+x[0]);
  await DB.doc(pdoc()).set({known:P.known,miss:P.miss,sessions:P.sessions,n:P.n,sum:P.sum,cnt:P.cnt,xp:P.xp,st:P.st,day:P.day,last:P.last});
  SUMB={...SUMB,[BOOK]:{n:P.n,avg:P.cnt?P.sum/P.cnt:null,known:P.known.length,last:P.sessions.length?P.sessions[P.sessions.length-1].t:0,top,updated:Date.now()}};
  await DB.doc('results/'+UID).set({books:SUMB});
  LAST=j;setSS('ok','✓ Đã lưu lịch sử học của bạn'+(P.n?' · '+P.n+' bài đã làm':''));
 }catch(e){
  if(e&&e.code=='unavailable'){setSS('wait','Mất kết nối, sẽ thử lưu lại…');setTimeout(flush,4000)}
  else{LOCAL=true;setSS('off','Không lưu được lên claude.ai – chuyển sang lưu trên thiết bị này.');busy=false;return flush()}
 }
 busy=false;if(CAN&&sig(P)!=LAST&&!tmr)touch()
}
function fmt(t){const d=new Date(t);return d.toLocaleDateString('vi-VN')+' '+d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})}
function hardStart(){const ids=Object.entries(P.miss).sort((a,b)=>b[1]-a[1]).slice(0,30).map(x=>+x[0]).filter(i=>DEFAULT[i]);if(!ids.length)return;mode='fc';fcStart(shuffle(ids));render()}
function resume(){const l=P.last;if(!l)return;F={u:l.u||'',s:l.s||''};applyF();fillSel();go(l.m)}
function openUnit(k){const U=[...new Set(DEFAULT.map(w=>w.u))];F={u:U[k],s:''};applyF();fillSel();go('list')}
function vNow(){
 if(CUSTOM)return `<div class="card c mu">Bạn đang dùng danh sách riêng nên tiến độ không được lưu.</div>`;
 const U=[...new Set(DEFAULT.map(w=>w.u))],kn=new Set(P.known);
 const R=U.map((u,k)=>{const ws=DEFAULT.filter(w=>w.u==u),sess=P.sessions.filter(x=>(x.f||'').startsWith(u));return{u,k,t:ws.length,kn:ws.filter(w=>kn.has(w.i)).length,n:sess.length,last:sess.length?sess[sess.length-1].t:0}});
 const act=R.filter(r=>r.kn||r.n).sort((a,b)=>b.last-a.last),idle=R.filter(r=>!(r.kn||r.n));
 const l=P.last,lm=l&&MODES.find(x=>x[0]==l.m);
 const row=r=>`<button class="tl" style="width:100%;min-height:0;margin-bottom:8px" onclick="openUnit(${r.k})"><div class="row sp" style="width:100%"><b>${esc(r.u)}</b><span class="mu">${r.kn}/${r.t} từ đã thuộc</span></div><div class="bar" style="margin:6px 0 2px;width:100%"><i style="width:${r.t?r.kn/r.t*100:0}%"></i></div><span class="mu">${r.n?r.n+' bài đã làm · lần cuối '+esc(fmt(r.last)):'Chưa làm bài nào'}</span></button>`;
 return (l&&lm?`<div class="card"><div class="mu">Bạn học gần nhất</div><div style="margin:6px 0 12px"><b>${esc(l.u||'Tất cả các Unit')}${l.s?' · '+esc(l.s):''}</b> — ${lm[1]} ${esc(lm[2])}</div><button class="pr" onclick="resume()">Tiếp tục học →</button></div>`:`<div class="card c"><b>Bạn chưa học phần nào</b><p class="mu">Chọn Unit ở thanh phía trên rồi mở một bài để bắt đầu. Tiến độ sẽ hiện ở đây.</p></div>`)
 +(act.length?`<div class="gh">Đang học</div>${act.map(row).join('')}`:'')
 +(idle.length?`<details style="margin-top:10px"><summary class="mu" style="cursor:pointer">Chưa học (${idle.length} Unit)</summary><div style="margin-top:8px">${idle.map(row).join('')}</div></details>`:'')}
function vHist(){
 if(CUSTOM)return `<div class="card c mu">Bạn đang dùng danh sách riêng nên lịch sử không được lưu. Bấm “Dùng lại danh sách Destination B1” ở tab Từ vựng để xem lịch sử.</div>`;
 if(!CAN)return `<div class="card c"><b>Chưa lưu được lịch sử</b><p class="mu">Hãy đăng nhập claude.ai (và mở bằng link giáo viên chia sẻ) để lịch sử học được lưu lại.</p></div>`;
 const hard=Object.entries(P.miss).sort((a,b)=>b[1]-a[1]).slice(0,15).filter(x=>DEFAULT[x[0]]);
 const acc=P.cnt?Math.round(P.sum/P.cnt*100)+'%':'–';
 return `<div class="card"><div class="row" style="gap:20px"><div><div class="big">${P.known.length}</div><div class="mu">từ đã thuộc / ${DEFAULT.length}</div></div><div><div class="big">${P.n}</div><div class="mu">bài đã làm</div></div><div><div class="big">${acc}</div><div class="mu">điểm trung bình</div></div></div>${CAN?'':'<p class="mu" style="margin-bottom:0">Tài khoản này chưa được lưu lịch sử.</p>'}</div>
<div class="card"><div class="row sp"><b>Từ hay sai</b>${hard.length?'<button class="pr" onclick="hardStart()">Ôn các từ hay sai</button>':''}</div>${hard.length?`<div class="tw"><table><tr><th>English</th><th>Tiếng Việt</th><th>Sai</th></tr>${hard.map(([i,c])=>`<tr><td>${esc(DEFAULT[i].en)}</td><td>${esc(DEFAULT[i].vi)}</td><td>${c}</td></tr>`).join('')}</table></div>`:'<p class="mu" style="margin-bottom:0">Chưa có từ nào bị sai.</p>'}</div>
<div class="card"><b>Các bài gần đây</b>${P.sessions.length?`<div class="tw"><table><tr><th>Thời gian</th><th>Bài</th><th>Phạm vi</th><th>Kết quả</th></tr>${P.sessions.slice(-30).reverse().map(x=>`<tr><td>${esc(fmt(x.t))}</td><td>${esc(KIND[x.m]||x.m)}</td><td>${esc(x.f||'')}</td><td>${x.s}/${x.n}${x.d!=null?' · '+x.d+'s':''}</td></tr>`).join('')}</table></div>`:'<p class="mu" style="margin-bottom:0">Chưa có bài nào. Làm một bài tập là lịch sử sẽ xuất hiện ở đây.</p>'}</div>`}
async function loadClass(){
 CL.err='';CL.rows=null;render();
 try{const sn=await DB.collection('results').get();const rows=sn.docs.map(d=>({id:d.id,...d.data()}));
  let ps={};try{ps=await USR.profiles(rows.map(r=>r.id))}catch(e){}
  CL.names={};rows.forEach(r=>CL.names[r.id]=(ps[r.id]&&ps[r.id].name)||'');CL.rows=rows}
 catch(e){CL.err='Không đọc được dữ liệu của lớp.';CL.rows=[]}
 render()}
function vCls(){
 if(CL.rows===null)return `<div class="card c mu">Đang tải kết quả của lớp…</div>`;
 const bk=r=>r.books?r.books[BOOK]:(BOOK=='b1'&&r.n!=null?r:null);
 const R=CL.rows.map(r=>({id:r.id,ok:!!bk(r),...(bk(r)||{})})).filter(r=>r.ok).sort((a,b)=>(b.last||0)-(a.last||0));
 const cnt={};R.forEach(r=>(r.top||[]).forEach(i=>cnt[i]=(cnt[i]||0)+1));
 const hard=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,15).filter(x=>DEFAULT[x[0]]);
 return `<div class="card"><div class="row sp"><b>Kết quả của lớp – ${esc((BOOKS.find(x=>x.id==BOOK)||{}).name||'')} (${R.length} học sinh)</b><button onclick="loadClass()">Làm mới</button></div>${CL.err?`<p class="bad msg">${esc(CL.err)}</p>`:''}
${R.length?`<div class="tw"><table><tr><th>Học sinh</th><th>Bài</th><th>Điểm TB</th><th>Đã thuộc</th><th>Lần cuối</th></tr>${R.map((r,k)=>`<tr><td>${esc(CL.names[r.id]||'Học sinh '+(k+1))}</td><td>${r.n||0}</td><td>${r.avg==null?'–':Math.round(r.avg*100)+'%'}</td><td>${r.known||0}</td><td>${r.last?esc(fmt(r.last)):'–'}</td></tr>`).join('')}</table></div>`:'<p class="mu" style="margin-bottom:0">Chưa có học sinh nào làm bài.</p>'}</div>
${hard.length?`<div class="card"><b>Từ cả lớp hay sai</b><div class="tw"><table><tr><th>English</th><th>Tiếng Việt</th><th>Số HS sai nhiều</th></tr>${hard.map(([i,c])=>`<tr><td>${esc(DEFAULT[i].en)}</td><td>${esc(DEFAULT[i].vi)}</td><td>${c}</td></tr>`).join('')}</table></div></div>`:''}`}
addEventListener('pagehide',()=>{clearTimeout(tmr);tmr=null;flush()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(tmr);tmr=null;flush()}});
function mergeLoaded(L){
 LAST=sig({known:L.known||[],miss:L.miss||{},sessions:L.sessions||[],n:L.n||0,sum:L.sum||0,cnt:L.cnt||0,xp:L.xp||0,st:L.st||0,day:L.day||'',last:L.last||null});
 const m={...(L.miss||{})};for(const k in P.miss)m[k]=(m[k]||0)+P.miss[k];const had=P.day;
 P={known:[...new Set([...(L.known||[]),...P.known])].sort((a,b)=>a-b),miss:m,sessions:(L.sessions||[]).concat(P.sessions).slice(-100),n:(L.n||0)+P.n,sum:(L.sum||0)+P.sum,cnt:(L.cnt||0)+P.cnt,xp:(L.xp||0)+(P.xp||0),st:L.st||0,day:L.day||'',last:P.last||L.last||null};
 if(had)bump();fc.known=new Set(P.known)}
function restore(){if(USED||CUSTOM||!(P.n||P.known.length||P.last))return;if(P.last){F={u:P.last.u||'',s:P.last.s||''};applyF();fillSel()}mode='now';render();USED=false}
let ENVP=null,ENVMSG='';
function initEnv(){if(ENVP)return ENVP;ENVP=(async()=>{
 try{
  if(!(window.claude&&claude.use)){LOCAL=true;ENVMSG='Lịch sử học được lưu trên thiết bị này.';return}
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  DB=db;USR=user;UID=user?await user.id():null;
  if(!db||!UID){LOCAL=true;ENVMSG='Chưa đăng nhập – lịch sử học chỉ lưu trên thiết bị này.';return}
  isAdmin=!!(await user.canEdit());
  if((await user.can('data.write'))===false){isAdmin=false;LOCAL=true;ENVMSG='Tài khoản này chỉ được xem – lịch sử chỉ lưu trên thiết bị này.';return}
  try{const r=await db.doc('results/'+UID).get();if(r.exists){const d=r.data();SUMB=d.books||(d.n!=null?{b1:{n:d.n,avg:d.avg,known:d.known,last:d.last,top:d.top,updated:d.updated}}:{})}}catch(e){}
 }catch(e){LOCAL=true;ENVMSG='Lịch sử học được lưu trên thiết bị này.'}
})();return ENVP}
function resetP(){clearTimeout(tmr);tmr=null;P={known:[],miss:{},sessions:[],n:0,sum:0,cnt:0,xp:0,st:0,day:'',last:null};LAST='';CAN=false;fc={};Q={};T={};M={};G={}}
async function loadBookProgress(){
 const id=BOOK;const to=setTimeout(()=>{if(!CAN&&BOOK==id)setSS('wait','Đang tải lịch sử… mạng chậm, bạn vẫn có thể học bình thường.')},10000);
 setSS('wait','Đang tải tiến độ…');
 await initEnv();if(BOOK!=id){clearTimeout(to);return}
 let L=null;
 if(LOCAL){try{L=JSON.parse(localStorage.getItem(lsk())||'null')}catch(e){}}
 else{try{const sn=await DB.doc(pdoc()).get();L=sn.exists?sn.data():null}catch(e){LOCAL=true;ENVMSG='Không tải được lịch sử đã lưu – tạm lưu trên thiết bị này.';try{L=JSON.parse(localStorage.getItem(lsk())||'null')}catch(e2){}}}
 clearTimeout(to);if(BOOK!=id)return;
 mergeLoaded(L||{});CAN=true;
 setSS('ok',LOCAL?ENVMSG:'✓ Lịch sử học của bạn được lưu tự động'+(P.n?' · '+P.n+' bài đã làm':''));
 touch();restore();render()}
async function leaveBook(){clearTimeout(tmr);tmr=null;while(busy)await new Promise(r=>setTimeout(r,50));await flush()}
async function pickBook(id){
 if(id==BOOK)return;await leaveBook();BOOK=id;const b=BOOKS.find(x=>x.id==id);try{localStorage.setItem('vocab_lastbook',id)}catch(e){}ALL=mk(b.raw);DEFAULT=ALL.slice();CUSTOM=false;F={u:'',s:''};
 resetP();applyF();fillSel();mode='list';USED=false;render();loadBookProgress()}
async function backToBooks(){await leaveBook();BOOK=null;mode='books';CAN=false;render();window.scrollTo(0,0)}
function vBooks(){return `<div class="card c mu">Chọn một sách ở trên để bắt đầu.</div>`}
applyF();fillSel();render();showSS();initEnv().then(()=>render());
{let lb=null;try{lb=localStorage.getItem('vocab_lastbook')}catch(e){}pickBook(BOOKS.some(b=>b.id==lb)?lb:BOOKS[0].id)}
